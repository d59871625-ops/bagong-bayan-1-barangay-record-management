  <body>
    <script>
      (() => {
        const url = new URL(window.location.href)
        if (url.searchParams.has('__bb1_open')) {
          url.searchParams.delete('__bb1_open')
          window.history.replaceState(window.history.state, '', url.href)
          return
        }
        url.searchParams.set('__bb1_open', `${Date.now()}`)
        window.location.replace(url.href)
      })()
    </script>
